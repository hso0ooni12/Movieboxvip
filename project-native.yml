name: FrameNative
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
packages:
  VLCKitSPM:
    url: https://github.com/rursache/VLCKitSPM
    revision: aa0082dd94e4c91450dc3b9cbadb2b385f1e995e
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: "YES"
    GCC_WARN_UNUSED_FUNCTION: "YES"
    GCC_WARN_UNUSED_VARIABLE: "YES"
targets:
  FrameNative:
    type: application
    platform: iOS
    sources:
      - path: FrameNative
        excludes:
          - FrameXTVPlayer.swift
          - FrameXTVPlayerV2.swift
          - FrameXTVPlayerV3.swift
          - FrameXTVPlayerV4.swift
          - FrameXTVPlayerV5.swift
          - Views/GenreCatalogView.swift
          - Views/XSFebboxPremiumCatalog.swift
    dependencies:
      - package: VLCKitSPM
    info:
      path: FrameNative/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        CADisableMinimumFrameDuration: true
        NSAppTransportSecurity:
          # IPTV endpoints can supply their own channel logo URLs. Permit those
          # source-provided images as well as the already-supported media URLs.
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInMedia: true
          NSExceptionDomains:
            otv8k.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.xsstore.xstv"
        PRODUCT_NAME: XSTV
        APP_DISPLAY_NAME: "XS TV"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: "NO"
        DEAD_CODE_STRIPPING: "YES"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: "wholemodule"
schemes:
  FrameNative:
    build:
      targets:
        FrameNative: all
    run:
      config: Debug
    archive:
      config: Release
# XS Player V6

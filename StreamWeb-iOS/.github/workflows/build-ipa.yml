name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name shown on iPhone
        required: true
        default: Stream Web
        type: string
      home_url:
        description: Website URL loaded by the app
        required: true
        default: https://streamimdb.ru/
        type: string
      bundle_id:
        description: Bundle ID embedded before you re-sign the IPA
        required: true
        default: com.yourname.streamweb
        type: string
      accent_hex:
        description: Accent color in #RRGGBB format
        required: true
        default: "#E50914"
        type: string
      ad_blocking_enabled:
        description: Block common ads and scripted popups
        required: true
        default: true
        type: boolean
      open_external_in_safari:
        description: Open user-tapped links to other domains in Safari
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APP_NAME: ${{ inputs.app_name }}
      HOME_URL: ${{ inputs.home_url }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      ACCENT_HEX: ${{ inputs.accent_hex }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure app
        shell: bash
        run: |
          args=(
            --app-name "$APP_NAME"
            --home-url "$HOME_URL"
            --bundle-id "$BUNDLE_ID"
            --accent-hex "$ACCENT_HEX"
          )

          if [ "${{ inputs.open_external_in_safari }}" = "true" ]; then
            args+=(--open-external-in-safari)
          fi

          if [ "${{ inputs.ad_blocking_enabled }}" != "true" ]; then
            args+=(--disable-ad-blocking)
          fi

          python3 scripts/configure.py "${args[@]}"
          python3 scripts/validate_project.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned device app
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail

          xcodebuild \
            -project StreamWeb.xcodeproj \
            -scheme StreamWeb \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee build/xcodebuild-device.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/StreamWeb.app"
          test -d "$APP_PATH"

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          SAFE_NAME="$(printf '%s' "$APP_NAME" | tr ' /' '--' | tr -cd '[:alnum:]._-')"
          SAFE_NAME="${SAFE_NAME:-StreamWeb}"

          PACKAGE_DIR="build/UnsignedPackage"
          IPA_PATH="build/${SAFE_NAME}-unsigned.ipa"
          rm -rf "$PACKAGE_DIR" "$IPA_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/StreamWeb.app"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "../${SAFE_NAME}-unsigned.ipa" Payload
          )

          test -f "$IPA_PATH"
          unzip -t "$IPA_PATH"

          if unzip -l "$IPA_PATH" | grep -qE '_CodeSignature|embedded\.mobileprovision'; then
            echo "The package unexpectedly contains signing files." >&2
            exit 1
          fi

          {
            echo "App name: $APP_NAME"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Website: $HOME_URL"
            echo "Ad blocking: ${{ inputs.ad_blocking_enabled }}"
            echo "Signing: none"
            echo "Build number: $GITHUB_RUN_NUMBER"
          } > build/BUILD-INFO.txt

          echo "FINAL_IPA=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: |
            ${{ env.FINAL_IPA }}
            build/BUILD-INFO.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-build-log
          path: build/xcodebuild-device.log
          retention-days: 7

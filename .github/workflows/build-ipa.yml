name: Build XsStore TV IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier
        required: true
        default: com.xsstore.tv
        type: string

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build XsStore TV
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project XsStoreTV.xcodeproj \
            -scheme XsStoreTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee build/xcodebuild-device.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/XsStoreTV.app"
          test -d "$APP_PATH"
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/XsStoreTV.app
          (cd build && /usr/bin/zip -qry XsStoreTV-unsigned.ipa Payload)
          test -f build/XsStoreTV-unsigned.ipa
          unzip -t build/XsStoreTV-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XsStoreTV-unsigned-ipa
          path: build/XsStoreTV-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XsStoreTV-build-log
          path: build/xcodebuild-device.log
          retention-days: 7

name: Public Media Source Integration Audit
on:
  push:
    branches:
      - r5-source-research-audit-20261020
    paths:
      - scripts/audit_public_media_sources_2026.py
      - scripts/audit_media_sources_extra.py
      - .github/workflows/audit-public-media-2026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect catalogs subtitles and player landing pages (no media downloads)
        run: python3 scripts/audit_public_media_sources_2026.py
      - name: Check Arabic subtitle samples and alternative providers
        run: python3 scripts/audit_media_sources_extra.py

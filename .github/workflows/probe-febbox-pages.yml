name: Febbox Read Only Catalog Shape + Pages
on:
  push:
    branches: ["diagnostics-febbox-public-20261019"]
    paths: [".github/workflows/probe-febbox-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Febbox pagination and browse into one shared folder without downloading video
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request, json
          headers={"User-Agent":"Mozilla/5.0","X-Requested-With":"XMLHttpRequest","Accept":"application/json"}
          def get(key,parent=0,page=1,pgsize=None):
            q={"share_key":key,"pwd":"","parent_id":str(parent),"is_html":"0","page":str(page)}
            if pgsize is not None: q["pagelimit"]=str(pgsize)
            url="https://www.febbox.com/file/file_share_list?"+urllib.parse.urlencode(q)
            req=urllib.request.Request(url,headers=dict(headers,Referer="https://www.febbox.com/share/"+key))
            with urllib.request.urlopen(req,timeout=22) as res:
              data=json.loads(res.read(750000))
            return data
          for label,key in [("Movies","C2jBoH52"),("TVshow","eHH8d0S1")]:
            for page in [1,2,3]:
              try:
                doc=get(key,page=page,pgsize=100)
                data=doc.get("data",{})
                files=data.get("file_list",[]) if isinstance(data,dict) else []
                print(label,"PAGE",page,"CODE",doc.get("code"),"COUNT",len(files),
                  "BODY_FIELDS",list(data.keys()) if isinstance(data,dict) else type(data).__name__)
                if page==1 and files:
                  first=files[0]
                  print(label,"FILE_FIELDS",list(first.keys()))
                  print(label,"TYPES_SUMMARY", {field:list(set(str(x.get(field)) for x in files))[:5] for field in ['is_dir','file_type','type','file_suffix'] if field in first})
                  folder=next((x for x in files if x.get('is_dir')==1 or str(x.get('is_dir'))=='1'),None)
                  if folder:
                    fid=folder.get("fid")
                    print(label,"FOLDER_ID_PRESENT", bool(fid))
                    if fid:
                      sub=get(key,parent=fid)
                      children=(sub.get("data") or {}).get("file_list") or []
                      print(label,"CHILD_CODE",sub.get("code"),"CHILD_COUNT",len(children),
                            "CHILD_FIELDS",list(children[0].keys()) if children else [])
              except Exception as exc:
                print(label,"PAGE",page,"ERROR",type(exc).__name__,str(exc)[:140])
          PY

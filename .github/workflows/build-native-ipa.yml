name: Build Frame Native IPA

on:
  push:
    branches: ["frame-native"]
    paths:
      - "FrameNative/**"
      - "project-native.yml"
      - ".github/workflows/build-native-ipa.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: App name shown on iPhone
        required: true
        default: Frame Native
        type: string
      bundle_id:
        description: Bundle ID embedded before you re-sign the IPA
        required: true
        default: com.yourname.framenative
        type: string

permissions:
  contents: read

jobs:
  build-native-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APP_NAME: ${{ inputs.app_name || 'Frame Native' }}
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.yourname.framenative' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        run: xcodegen generate --spec project-native.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned native device app
        shell: bash
        run: |
          mkdir -p build-native
          set -o pipefail

          xcodebuild \
            -project FrameNative.xcodeproj \
            -scheme FrameNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-native/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            APP_DISPLAY_NAME="$APP_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee build-native/xcodebuild-device.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="build-native/DerivedData/Build/Products/Release-iphoneos/FrameNative.app"
          test -d "$APP_PATH"

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          SAFE_NAME="$(printf '%s' "$APP_NAME" | tr ' /' '--' | tr -cd '[:alnum:]._-')"
          SAFE_NAME="${SAFE_NAME:-FrameNative}"
          PACKAGE_DIR="build-native/UnsignedPackage"
          IPA_PATH="build-native/${SAFE_NAME}-unsigned.ipa"

          rm -rf "$PACKAGE_DIR" "$IPA_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/FrameNative.app"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "../${SAFE_NAME}-unsigned.ipa" Payload
          )

          unzip -t "$IPA_PATH"

          if unzip -l "$IPA_PATH" | grep -qE '_CodeSignature|embedded\.mobileprovision'; then
            echo "Unexpected signing files were found in the IPA." >&2
            exit 1
          fi

          {
            echo "App name: $APP_NAME"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Target: Native SwiftUI + AVKit"
            echo "Minimum iOS: 16.0"
            echo "Signing: none"
            echo "Build number: $GITHUB_RUN_NUMBER"
          } > build-native/BUILD-INFO.txt

          echo "FINAL_IPA=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: frame-native-unsigned-ipa
          path: |
            ${{ env.FINAL_IPA }}
            build-native/BUILD-INFO.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-native-build-log
          path: build-native/xcodebuild-device.log
          retention-days: 7

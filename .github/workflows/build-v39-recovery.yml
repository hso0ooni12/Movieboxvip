name: Build XS TV V39 Recovery

on:
  push:
    branches: ["v39-recovery"]
    paths:
      - "FrameNative/**"
      - "scripts/**"
      - "project-native.yml"
      - ".github/workflows/build-v39-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v39-recovery:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      APP_NAME: XS TV
      BUNDLE_ID: com.xsstore.xstv

    steps:
      - name: Checkout exact V39 recovery branch
        uses: actions/checkout@v4

      - name: Verify recovery branch baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v39-recovery"
          test -f scripts/app_v39_stable_vlc_surface.py
          test -f scripts/app_v39r_surgical_player_fix.py
          test -f scripts/test_v39r_surgical_player_fix.py
          test -f scripts/app_v39r3_smoothness.py
          test -f scripts/app_v39r4_final_polish.py
          test -f scripts/app_v39r5_app_performance.py
          test -f scripts/test_v39r3_smoothness.py
          test -f scripts/test_v39r5_app_performance.py

      - name: Embed Sports IPTV credentials from GitHub Secrets
        shell: bash
        env:
          XS_IPTV_HOST: ${{ secrets.XS_IPTV_HOST }}
          XS_IPTV_USERNAME: ${{ secrets.XS_IPTV_USERNAME }}
          XS_IPTV_PASSWORD: ${{ secrets.XS_IPTV_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$XS_IPTV_HOST"
          test -n "$XS_IPTV_USERNAME"
          test -n "$XS_IPTV_PASSWORD"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def swift_string(value: str) -> str:
              value = value.replace('\\', '\\\\').replace('"', '\\"')
              value = value.replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
              return '"' + value + '"'
          target = Path('FrameNative/Core/IPTVEmbeddedConfig.swift')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              'import Foundation\n\n'
              'enum XSIPTVEmbeddedConfig {\n'
              '    static let credentials: IPTVCredentials? = IPTVCredentials(\n'
              f'        host: {swift_string(os.environ["XS_IPTV_HOST"])},\n'
              f'        username: {swift_string(os.environ["XS_IPTV_USERNAME"])},\n'
              f'        password: {swift_string(os.environ["XS_IPTV_PASSWORD"])}\n'
              '    )\n'
              '    static let isConfigured = true\n'
              '}\n', encoding='utf-8')
          print('Sports IPTV configuration generated from GitHub Secrets.')
          PY

      - name: Generate XS TV brand assets
        shell: bash
        run: |
          set -euo pipefail
          APPICON_DIR="FrameNative/Assets.xcassets/AppIcon.appiconset"
          LOGO_DIR="FrameNative/Assets.xcassets/XSStoreLogo.imageset"
          mkdir -p "$APPICON_DIR" "$LOGO_DIR"
          cat > /tmp/xstv-icon.swift <<'SWIFT'
          import AppKit
          func polygon(_ points: [NSPoint]) -> NSBezierPath {
              let p = NSBezierPath(); guard let first = points.first else { return p }
              p.move(to: first); for point in points.dropFirst() { p.line(to: point) }; p.close(); return p
          }
          func makeIcon(size: CGFloat, path: String) throws {
              let image = NSImage(size: NSSize(width: size, height: size)); image.lockFocus()
              NSColor(calibratedRed: 0.025, green: 0.02, blue: 0.055, alpha: 1).setFill()
              NSRect(x: 0, y: 0, width: size, height: size).fill()
              let gradient = NSGradient(colors: [NSColor(calibratedRed: 0.22, green: 0.04, blue: 1.0, alpha: 1), NSColor(calibratedRed: 0.76, green: 0.02, blue: 0.62, alpha: 1), NSColor(calibratedRed: 1.0, green: 0.24, blue: 0.02, alpha: 1)])!
              let w = size, h = size
              let left = polygon([NSPoint(x:w*0.13,y:h*0.18),NSPoint(x:w*0.29,y:h*0.18),NSPoint(x:w*0.59,y:h*0.84),NSPoint(x:w*0.49,y:h*0.93)])
              let middle = polygon([NSPoint(x:w*0.34,y:h*0.18),NSPoint(x:w*0.50,y:h*0.18),NSPoint(x:w*0.69,y:h*0.68),NSPoint(x:w*0.61,y:h*0.79)])
              let right = polygon([NSPoint(x:w*0.54,y:h*0.18),NSPoint(x:w*0.85,y:h*0.18),NSPoint(x:w*0.70,y:h*0.52),NSPoint(x:w*0.61,y:h*0.41)])
              for shape in [left,middle,right] { gradient.draw(in: shape, angle: 225) }
              image.unlockFocus()
              guard let tiff=image.tiffRepresentation, let rep=NSBitmapImageRep(data:tiff), let png=rep.representation(using:.png,properties:[:]) else { throw NSError(domain:"XSTV",code:1) }
              try png.write(to: URL(fileURLWithPath:path))
          }
          try makeIcon(size:1024,path:CommandLine.arguments[1]); try makeIcon(size:512,path:CommandLine.arguments[2])
          SWIFT
          swift /tmp/xstv-icon.swift "$APPICON_DIR/AppIcon-1024.png" "$LOGO_DIR/XSStoreLogo.png"
          cat > "$APPICON_DIR/Contents.json" <<'JSON'
          {"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > "$LOGO_DIR/Contents.json" <<'JSON'
          {"images":[{"filename":"XSStoreLogo.png","idiom":"universal","scale":"1x"},{"idiom":"universal","scale":"2x"},{"idiom":"universal","scale":"3x"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > "FrameNative/Assets.xcassets/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON

      - name: Generate proven V39 movie player baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/player_visibility_fix.py
          python3 scripts/player_v7_stable_engine.py
          python3 scripts/player_v8_functional_fix.py
          python3 scripts/player_v9_subtitle_tap_fix.py
          python3 scripts/player_v11_subtitle_network_server_fix.py
          python3 scripts/player_v24_source_menu_bridge.py
          python3 scripts/player_v25_run3.py
          python3 scripts/player_v25_indent_fix.py
          python3 scripts/player_v25_restore_v24_request.py
          python3 scripts/player_v26_final_ui_polish.py
          python3 scripts/player_v27_compact_subtitle_controls.py
          python3 scripts/player_v28_proportional_chrome.py
          python3 scripts/player_v29_ultra_compact.py
          python3 scripts/app_v29_smooth_browsing.py
          python3 scripts/player_v30_floating_hit_targets.py
          python3 scripts/app_v34_ios_player_clean_anime.py
          python3 scripts/app_v35_final_polish.py

      - name: Regression test source-owned subtitles
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/xs-subtitle-tests" --no-audit --no-fund jsdom@26.1.0 @sinonjs/fake-timers@13.0.5
          NODE_PATH="$RUNNER_TEMP/xs-subtitle-tests/node_modules" node --test scripts/test_source_subtitles.cjs

      - name: Verify V26 V29 V30 V33 V34 baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_v26_player_integrity.py
          python3 scripts/test_v29_compact_promotion.py
          python3 scripts/test_v30_reference_ui.py
          python3 scripts/test_v33_sports_vlc.py
          python3 scripts/test_v34_native_player_clean_anime.py

      - name: Generate and verify final V39 stable baseline
        run: python3 scripts/test_v35_final_polish.py

      - name: Apply and verify only V39 recovery fixes
        run: python3 scripts/test_v39r_surgical_player_fix.py

      - name: Apply and verify V39 smoothness and app performance fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/app_v39r3_smoothness.py
          python3 scripts/app_v39r4_final_polish.py
          python3 scripts/app_v39r5_app_performance.py
          python3 scripts/test_v39r3_smoothness.py
          python3 scripts/test_v39r5_app_performance.py

      - name: Guard against post-V39 player contamination
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "V40_PLAYER_SERVER_AUDIT" FrameNative/FrameXTVPlayerV6.swift
          ! grep -q "V42_FRAME_SOURCE_SERVER_QUALITY" FrameNative/FrameXTVPlayerV6.swift
          ! grep -q "xsNetworkServers" FrameNative/FrameXTVPlayerV6.swift
          grep -q "V39R_SURGICAL_PLAYER_FIX" FrameNative/FrameXTVPlayerV6.swift
          grep -q "V39R4_FINAL_POLISH" FrameNative/FrameXTVPlayerV6.swift
          grep -q "V39R5_APP_PERFORMANCE" FrameNative/Core/AppState.swift
          grep -q "V39R5_APP_PERFORMANCE" FrameNative/Views/DetailView.swift
          grep -q "V39_STABLE_VLC_SURFACE" FrameNative/Views/SportsLiveViewV33.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        run: xcodegen generate --spec project-native.yml

      - name: Build unsigned Release device app
        shell: bash
        run: |
          mkdir -p build-native
          set -o pipefail
          xcodebuild \
            -project FrameNative.xcodeproj \
            -scheme FrameNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-native/DerivedData \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            APP_DISPLAY_NAME="$APP_NAME" \
            MARKETING_VERSION="2.0.39.1" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee build-native/xcodebuild-device.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build-native/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"; test -d "$APP_PATH"
          rm -rf "$APP_PATH/_CodeSignature"; rm -f "$APP_PATH/embedded.mobileprovision"
          PACKAGE_DIR="build-native/UnsignedPackage"
          IPA_PATH="build-native/XS-TV-V39R-unsigned.ipa"
          rm -rf "$PACKAGE_DIR" "$IPA_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/XSTV.app"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "../XS-TV-V39R-unsigned.ipa" Payload)
          unzip -t "$IPA_PATH"
          {
            echo "App name: $APP_NAME"
            echo "Bundle ID: $BUNDLE_ID"
            echo "Baseline: V39 stable recovery"
            echo "Movies/series: V39 source server selector preserved"
            echo "Server quality: source-row 4K/Full HD/HD + selected decoder-height confirmation"
            echo "Server/subtitles: strict source-popup isolation and Swift-side rejection boundary"
            echo "Subtitles: V24 source-owned selection preserved"
            echo "Subtitle background: Black/Gray/White/None and live opacity propagation fixed"
            echo "Sports: V39 stable VLC surface preserved"
            echo "Performance: Release optimization + ProMotion settings preserved"
            echo "Minimum iOS: 16.0"
            echo "Signing: none"
            echo "Commit: $GITHUB_SHA"
          } > build-native/BUILD-INFO.txt
          echo "FINAL_IPA=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate packaged IPA
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/xstv-v39r-check"
          rm -rf "$CHECK_DIR"; mkdir -p "$CHECK_DIR"
          unzip -q "$FINAL_IPA" -d "$CHECK_DIR"
          APP="$CHECK_DIR/Payload/XSTV.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Assets.car"
          ACTUAL_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$ACTUAL_BUNDLE" = "$BUNDLE_ID"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          test "$MIN_OS" = "16.0"
          PROMOTION="$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDuration' "$APP/Info.plist")"
          case "$PROMOTION" in
            true|TRUE|YES|1) ;;
            *) echo "Unexpected CADisableMinimumFrameDuration value: $PROMOTION" >&2; exit 1 ;;
          esac
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -x "$APP/$EXECUTABLE"
          IPA_BYTES="$(stat -f%z "$FINAL_IPA")"
          test "$IPA_BYTES" -gt 1500000
          echo "V39R IPA validation PASS: $IPA_BYTES bytes, bundle=$ACTUAL_BUNDLE, minOS=$MIN_OS, ProMotion=$PROMOTION"

      - name: Upload V39 recovery unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: xs-tv-v39-recovery-unsigned-ipa
          path: |
            ${{ env.FINAL_IPA }}
            build-native/BUILD-INFO.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xs-tv-v39-recovery-build-log
          path: build-native/xcodebuild-device.log
          retention-days: 7

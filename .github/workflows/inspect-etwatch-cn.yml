name: ETWatch CN Public API Inspection
on:
  push:
    branches: [etwatch-cn-api-inspection-20261022]
    paths:
      - scripts/inspect_etwatch_cn_public.py
      - .github/workflows/inspect-etwatch-cn.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published page, scripts, and API metadata only
        run: python3 scripts/inspect_etwatch_cn_public.py

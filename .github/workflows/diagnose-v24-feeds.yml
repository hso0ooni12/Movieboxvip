name: Diagnose V24 empty movie and series catalogs
on:
  push:
    branches:
      - v24-source-playback-diagnostics-20261022
    paths:
      - scripts/diagnose_v24_source_feeds.py
      - .github/workflows/diagnose-v24-feeds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/diagnose_v24_source_feeds.py
